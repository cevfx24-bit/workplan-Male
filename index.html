<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editable Workplan Calendar</title><style>
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface-subtle:#f1f5f9;
  --ink:#0f172a;
  --ink-secondary:#334155;
  --muted:#64748b;
  --line:#e2e8f0;
  --line-strong:#cbd5e1;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --accent-soft:#eff6ff;
  --danger:#dc2626;
  --danger-soft:#fef2f2;
  --success:#16a34a;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --shadow-xs:0 1px 2px rgba(15,23,42,0.04);
  --shadow-sm:0 4px 12px rgba(15,23,42,0.05);
  --shadow-lg:0 20px 40px rgba(15,23,42,0.14);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* Minimalist Sticky Top Bar */
header{
  position:sticky;
  top:0;
  z-index:200;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px clamp(16px,3vw,32px);
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.brand-block{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.brand-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--ink);
  color:#ffffff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:var(--shadow-xs);
}
.brand-text{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
header h1{
  font-size:1.02rem;
  margin:0;
  font-weight:700;
  letter-spacing:-0.02em;
  color:var(--ink);
  line-height:1.2;
}
.header-slogan{
  font-size:12px;
  font-weight:500;
  color:var(--muted);
}
.header-top-row{
  width:100%;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.header-bottom-align{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-top:9px;
  border-top:1px solid #e2e8f0;
}
.header-align-meta{
  display:flex;
  align-items:center;
  gap:8px;
}
.header-align-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:#475569;
  white-space:nowrap;
}
.header-align-hint{
  font-size:11px;
  color:#64748b;
  font-weight:500;
}
.header-align-tap{
  width:min(360px,100%);
  height:34px;
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:3px;
  box-shadow:inset 0 1px 2px rgba(15,23,42,0.06);
}
@media(min-width:801px){
  header{
    padding:12px clamp(18px,3vw,32px) 10px;
    gap:8px;
  }
  .header-bottom-align{
    justify-content:flex-end;
    gap:14px;
    padding-top:8px;
  }
}

/* Vibrant Dashboard Buttons */
button,.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid transparent;
  background:var(--accent);
  color:#ffffff;
  border-radius:var(--radius-sm);
  padding:8px 14px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  line-height:1.2;
  transition:all .15s ease;
  box-shadow:var(--shadow-xs);
}
button:hover{background:var(--accent-hover);transform:translateY(-0.5px)}
button:active{transform:translateY(0)}

button.btn-preview{
  background:#4f46e5;
  border-color:#4f46e5;
  color:#ffffff;
}
button.btn-preview:hover{
  background:#4338ca;
  border-color:#4338ca;
}
button.btn-save{
  background:#2563eb;
  border-color:#2563eb;
  color:#ffffff;
}
button.btn-save:hover{
  background:#1d4ed8;
  border-color:#1d4ed8;
}
button.btn-print{
  background:#16a34a;
  border-color:#16a34a;
  color:#ffffff;
}
button.btn-print:hover{
  background:#15803d;
  border-color:#15803d;
}
button.btn-reset{
  background:#dc2626;
  border-color:#dc2626;
  color:#ffffff;
}
button.btn-reset:hover{
  background:#b91c1c;
  border-color:#b91c1c;
}
button.secondary{
  background:#334155;
  border-color:#475569;
  color:#ffffff;
}
button.secondary:hover{
  background:#475569;
}

/* Dashboard Main Container */
.wrap{
  max-width:1480px;
  margin:0 auto;
  padding:20px clamp(14px,3vw,32px) 40px;
}

/* Top Toolbar + Live Summary Strip */
.dashboard-bar{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);
  gap:14px;
  margin-bottom:18px;
  align-items:stretch;
}
.controls{
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-xs);
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  align-items:end;
}
.controls label{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--muted);
}
.controls select,.controls input{
  width:100%;
  height:38px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--ink);
  font-size:13px;
  font-weight:500;
  letter-spacing:-0.01em;
  box-shadow:0 1px 2px rgba(15,23,42,0.03);
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
}
#textAlign{
  background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
  border-color:#cbd5e1;
  font-weight:600;
  color:var(--ink);
}
.controls select:hover,.controls input:hover{
  border-color:#94a3b8;
  background:var(--surface);
}
.controls select:focus,.controls input:focus{
  outline:none;
  background:var(--surface);
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

/* Minimalist KPI Summary Strip */
.stats-strip{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-xs);
  padding:12px 16px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  align-items:center;
}
.stat-item{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:4px 8px;
  border-left:1px solid var(--line);
}
.stat-item:first-child{border-left:0;padding-left:2px}
.stat-label{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.stat-value{
  font-size:1.15rem;
  font-weight:700;
  color:var(--ink);
  letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
}
.stat-value.is-blue{color:var(--accent)}
.stat-value.is-red{color:var(--danger)}
.stat-value.is-muted{color:var(--muted)}

/* Workspace Card */
.sheet-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:18px;
}
.monthtitle{
  text-align:center;
  font-size:1.2rem;
  font-weight:400;
  color:var(--ink-secondary);
  margin:2px 0 16px;
  letter-spacing:-0.01em;
}
.monthtitle strong{
  color:var(--ink);
  font-weight:700;
}

.calendar-scroll{
  width:100%;
  overflow:visible;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  overflow:visible;
}
.dow{
  padding:10px 6px;
  text-align:center;
  background:var(--bg);
  color:var(--muted);
  font-weight:650;
  font-size:11px;
  letter-spacing:0.05em;
  text-transform:uppercase;
}
.dow:first-child{border-top-left-radius:11px}
.dow:nth-child(7){border-top-right-radius:11px}

.day{
  min-height:148px;
  background:var(--surface);
  padding:8px;
  position:relative;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:visible;
  min-width:0;
  transition:background .12s ease;
}
.day:hover{background:#fcfdff}
.day.is-weekend{background:#fafbfd}
.day.filler{
  background:#f8fafc;
}
.dayhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:4px;
  min-width:0;
  width:100%;
}
.daynum{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 5px;
  border-radius:6px;
  background:var(--surface-subtle);
  font-size:0.8rem;
  font-weight:700;
  color:var(--ink-secondary);
  outline:none;
  flex:0 0 auto;
}
.daynum:focus{
  background:var(--accent-soft);
  color:var(--accent);
}
.shift-pick{
  flex:1 1 auto;
  min-width:88px;
  max-width:100%;
  position:relative;
  z-index:10;
}
.shift-pick.dropdown-open{z-index:80}
.shift-toggle{
  width:100%;
  min-width:0;
  max-width:100%;
  margin:0;
  padding:3px 6px;
  border:1px solid #bfdbfe;
  border-radius:8px;
  background:#eff6ff;
  color:var(--accent);
  font-size:clamp(7.2px,0.62vw,8.5px);
  font-weight:600;
  font-style:italic;
  text-align:center;
  line-height:1.18;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2px;
  box-shadow:0 1px 2px rgba(37,99,235,0.08);
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  overflow-wrap:anywhere;
  transition:all .14s ease;
}
.shift-toggle:hover,.shift-toggle:focus{
  background:#dbeafe;
  border-color:#93c5fd;
  outline:none;
  transform:none;
}
.shift-toggle.is-dayoff{
  color:var(--danger);
  font-weight:700;
  background:var(--danger-soft);
  border-color:#fecaca;
}
.shift-menu{
  position:fixed;
  z-index:90;
  background:var(--surface);
  border:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg);
  border-radius:9px;
  padding:4px;
  min-width:148px;
  max-width:calc(100vw - 16px);
  max-height:calc(100vh - 120px);
  overflow-y:auto;
  display:none;
  flex-direction:column;
  gap:2px;
  pointer-events:auto;
}
.shift-pick.dropdown-open .shift-menu{
  display:flex;
}
.shift-menu-item{
  width:100%;
  padding:6px 9px;
  border:none;
  border-radius:6px;
  background:transparent;
  color:var(--ink);
  font-size:9.5px;
  font-weight:600;
  font-style:normal;
  text-align:left;
  justify-content:flex-start;
  white-space:nowrap;
  line-height:1.2;
  box-shadow:none;
  cursor:pointer;
  touch-action:manipulation;
}
.shift-menu-item:hover{
  background:var(--accent-soft);
  color:var(--accent);
  transform:none;
}
.shift-menu-item.active{
  background:var(--accent);
  color:#ffffff;
}
.shift-menu-item.is-dayoff-opt{
  color:var(--danger);
}
.shift-menu-item.is-dayoff-opt.active{
  background:var(--danger);
  color:#ffffff;
}

.taskpick{
  width:100%;
  font-size:11px;
  position:relative;
  z-index:8;
}
.day.dropdown-open{z-index:70}
.taskpick.dropdown-open{z-index:75}
.taskpick.dropdown-open .tasklist{z-index:85}
.tasktoggle{
  width:100%;
  cursor:pointer;
  border:1px solid var(--line);
  padding:5px 8px;
  background:var(--bg);
  color:var(--ink-secondary);
  font-size:11px;
  border-radius:7px;
  text-align:left;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:none;
}
.tasktoggle:hover{
  border-color:#94a3b8;
  background:var(--surface);
  transform:none;
}
.taskpick .tasklist{
  position:absolute;
  left:0;
  right:auto;
  top:calc(100% + 5px);
  z-index:85;
  background:var(--surface);
  border:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg);
  width:276px;
  max-width:calc(100vw - 20px);
  max-height:260px;
  overflow-y:auto;
  overflow-x:hidden;
  padding:8px 8px 0;
  font-size:11.5px;
  border-radius:var(--radius-md);
}
.taskpick.align-left-edge .tasklist{
  left:auto;
  right:0;
}
.taskpick label{
  display:flex;
  align-items:flex-start;
  gap:8px;
  white-space:normal;
  padding:6px 6px;
  border-bottom:1px solid var(--surface-subtle);
  line-height:1.35;
  color:var(--ink-secondary);
  border-radius:6px;
  cursor:pointer;
}
.taskpick label:hover{background:var(--bg)}
.taskpick input[type="checkbox"]{
  margin:2px 0 0;
  accent-color:var(--accent);
  flex-shrink:0;
}
.task-cap-row{
  position:sticky;
  bottom:0;
  z-index:10;
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:6px;
  margin:6px -8px 0;
  padding:8px;
  border-top:1px solid var(--line);
  box-shadow:0 -4px 10px rgba(15,23,42,0.05);
}
.task-capitalization{
  flex:1 1 auto;
  min-width:0;
  padding:5px 7px;
  border:1px solid var(--line-strong);
  border-radius:6px;
  background:var(--bg);
  color:var(--ink-secondary);
  font-size:11px;
  font-weight:500;
}
.taskpick .tasklist button.apply-btn{
  flex:0 0 auto;
  padding:6px 11px;
  border-radius:6px;
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}

.day textarea{
  width:100%;
  max-width:100%;
  min-height:84px;
  max-height:160px;
  resize:vertical;
  border:1px solid transparent;
  border-radius:7px;
  padding:6px 7px 6px 14px;
  background:transparent;
  font:inherit;
  font-size:11.5px;
  line-height:1.35;
  color:var(--ink);
  outline:none;
  white-space:pre-line;
  overflow-wrap:break-word;
  word-break:normal;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
}
.day textarea:focus{
  border-color:#93c5fd;
  background:var(--accent-soft);
}
.day textarea.task-note-hidden{
  display:none !important;
}

/* Minimalist Signatory Cards */
.signatures{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  margin-top:18px;
  font-size:9.5pt;
  color:var(--ink);
}
.signature{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 16px;
  text-align:center;
}
.signature [contenteditable="true"]{outline:none;border-radius:4px}
.signature [contenteditable="true"]:focus{background:var(--accent-soft)}
.signature > div:first-child{
  font-size:11.5px;
  color:var(--muted);
  font-weight:500;
}
.signature .name{
  display:inline-block;
  min-width:190px;
  min-height:20px;
  border-bottom:1.5px solid var(--ink);
  font-weight:700;
  margin-top:18px;
  padding:0 10px 3px;
  letter-spacing:0.01em;
}
.signature .role{
  margin-top:4px;
  font-size:12px;
  color:var(--ink-secondary);
  font-weight:500;
}

#taskLimitToast{
  position:fixed;
  top:20px;
  right:20px;
  transform:translateY(-8px) scale(0.98);
  background:rgba(15,23,42,0.92);
  backdrop-filter:blur(12px);
  color:#f8fafc;
  border:1px solid rgba(255,255,255,0.12);
  padding:10px 16px;
  border-radius:12px;
  font-size:12.5px;
  font-weight:500;
  letter-spacing:-0.01em;
  display:inline-flex;
  align-items:center;
  gap:8px;
  z-index:99999;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  box-shadow:0 12px 28px rgba(15,23,42,0.22);
}
#taskLimitToast::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:999px;
  background:#38bdf8;
  flex-shrink:0;
}
#taskLimitToast.show{
  opacity:1;
  transform:translateY(0) scale(1);
}
.dropdown-limit-notice{
  display:none;
  margin:4px 0 2px;
  padding:6px 8px;
  border-radius:6px;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#dc2626;
  font-size:11px;
  font-weight:600;
  line-height:1.25;
}
.dropdown-limit-notice.show{
  display:block;
}

/* Responsive A4 Landscape Preview Modal (Phone & Desktop) */
.preview-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,0.88);
  backdrop-filter:blur(6px);
  z-index:50000;
  display:none;
  flex-direction:column;
  height:100dvh;
}
.preview-overlay.open{display:flex}
.preview-bar{
  background:#0f172a;
  color:#f8fafc;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:1px solid #1e293b;
  flex-shrink:0;
}
.preview-bar-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13.5px;
  font-weight:650;
}
.preview-badge{
  background:#1e293b;
  border:1px solid #334155;
  color:#93c5fd;
  font-size:11px;
  padding:3px 9px;
  border-radius:999px;
  white-space:nowrap;
}
.preview-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.preview-seg-group{
  display:inline-flex;
  align-items:center;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:8px;
  padding:2px;
  gap:2px;
}
.preview-seg-group button{
  background:transparent;
  border-color:transparent;
  color:#cbd5e1;
  padding:5px 9px;
  font-size:12px;
  border-radius:6px;
  white-space:nowrap;
  box-shadow:none;
}
.preview-seg-group button.active,.preview-seg-group button:hover{
  background:#334155;
  color:#fff;
  transform:none;
}
.preview-stage{
  flex:1;
  min-height:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
}
.preview-stage.is-phone-sim{
  justify-content:center;
  background:radial-gradient(circle at top,#1e293b 0%,#0b1120 100%);
}
.preview-device-frame{
  margin:auto;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  transition:all .2s ease;
}
.preview-device-frame.phone-mode{
  width:390px;
  max-width:100%;
  min-height:720px;
  max-height:100%;
  background:#090d16;
  border:10px solid #334155;
  border-radius:36px;
  padding:26px 10px 18px;
  box-shadow:0 28px 70px rgba(0,0,0,0.65),inset 0 0 0 2px #1e293b;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  position:relative;
  display:block;
}
.preview-device-frame.phone-mode::before{
  content:"";
  position:sticky;
  top:-16px;
  display:block;
  width:96px;
  height:5px;
  background:#475569;
  border-radius:999px;
  margin:0 auto 12px;
  z-index:5;
}
.preview-scaler{
  position:relative;
  flex-shrink:0;
  margin:0 auto;
}
/* Exact A4 Landscape Sheet (297mm x 210mm) */
.a4-sheet{
  position:absolute;
  top:0;
  left:0;
  transform-origin:top left;

      <div class="preview-scaler" id="previewScaler">
        <div class="a4-sheet" id="a4SheetMount"></div>
      </div>
    </div>
  </div>
</div>

<div id="resetConfirmOverlay" role="dialog" aria-modal="true" aria-labelledby="resetConfirmTitle">
  <div class="reset-confirm-card">
    <h2 class="reset-confirm-title" id="resetConfirmTitle">Reset schedule?</h2>
    <p class="reset-confirm-desc">This will clear all saved shifts and tasks for the selected month.</p>
    <div class="reset-confirm-actions">
      <button type="button" class="reset-btn-cancel" id="resetCancelBtn">Cancel</button>
      <button type="button" class="reset-btn-confirm" id="resetConfirmBtn">Reset</button>
    </div>
  </div>
</div>

<div id="taskLimitToast" role="status" aria-live="polite">Maximum of 7 tasks only.</div>

<script>
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
const taskOptions=[
  'Roving and monitoring the assigned area',
  'Inspecting facilities',
  'Inspecting facilities in the assigned area',
  'Minor electrical repairs',
  'Grass-cutting and cleaning of the assigned area',
  'Minor repair of water faucets',
  'Watering plants',
  'Watering vegetables',
  'Cleaning the front and backyard surroundings',
  'Cleaning gutters',
  'Tree Branch Trimming',
  'Water Pipe Repair',
  'Roof Repair',
  'Canal Repair',
  'Canal Cleaning',
  'Vegetable & Ornamental Planting',
  'Public CR Cleaning',
  'Soil Cultivation',
  'Weed Removal',
  'Garden Maintenance',
  'Pathway Clearing',
  'Facility Repair',
  'Drainage Maintenance',
  'Debris Disposal',
  'Garbage Bin Repair',
  'Waste Segregation & Disposal',
  'Garbage Area Cleaning',
  'CCTV Maintenance',
  'CCTV Monitoring',
  'Computer Maintenance',
  'Computer Repair',
  'Printer Maintenance',
  'Printer Repair',
  'IT & Network Support',
  'Technical Support',
  'Cleaning Around the Area'
];

function key(){
  return 'workplan-'+document.getElementById('year').value+'-'+document.getElementById('month').value;
}

function getEffectiveOffset(y, m){
  return new Date(y, m, 1).getDay();
}

function getDaysInMonth(y, m){
  return new Date(y, m + 1, 0).getDate();
}

function computeTaskFontPx(text){
  if(!text || !text.trim()) return 11.2;
  const lines = text.split('\n').reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 24)), 0);
  if(lines >= 14) return 7.4;
  if(lines >= 11) return 8.0;
  if(lines >= 8) return 8.8;
  if(lines >= 5) return 9.8;
  if(lines >= 3) return 10.8;
  return 11.8;
}

function positionShiftMenu(toggleEl, menuEl, pickWrap, dayCell){
  const headerEl = document.querySelector('header');
  const headerBottom = headerEl ? Math.max(0, headerEl.getBoundingClientRect().bottom) : 0;
  const rect = toggleEl.getBoundingClientRect();
  const minTop = Math.max(8, headerBottom + 6);

  if(rect.bottom <= headerBottom + 2 || rect.top >= window.innerHeight - 6){
    menuEl.style.display = 'none';
    return;
  }

  menuEl.style.display = 'flex';
  const menuW = menuEl.offsetWidth || 185;
  const maxAvailBelow = Math.max(48, window.innerHeight - minTop - 8);
  menuEl.style.maxHeight = maxAvailBelow + 'px';
  const menuH = Math.min(menuEl.scrollHeight || 165, maxAvailBelow);

  let leftPos = rect.left;
  if(leftPos + menuW > window.innerWidth - 8){
    leftPos = window.innerWidth - menuW - 8;
  }
  if(leftPos < 8) leftPos = 8;

  let topPos = rect.bottom + 4;
  if(topPos < minTop){
    topPos = minTop;
  }
  if(topPos + menuH > window.innerHeight - 8){
    const aboveTop = rect.top - menuH - 4;
    if(aboveTop >= minTop){
      topPos = aboveTop;
    } else {
      topPos = minTop;
    }
  }

  menuEl.style.left = leftPos + 'px';
  menuEl.style.top = topPos + 'px';
  if(pickWrap) pickWrap.classList.add('dropdown-open');
  if(dayCell) dayCell.classList.add('dropdown-open');
}

function positionTaskDropdown(toggleEl, listEl, pickWrap){
  if(!toggleEl || !listEl || !pickWrap) return;
  pickWrap.classList.remove('align-left-edge');
  listEl.style.left = '0';
  listEl.style.right = 'auto';
  listEl.style.transform = '';

  const rect = toggleEl.getBoundingClientRect();
  const menuW = Math.min(276, window.innerWidth - 20);
  listEl.style.width = menuW + 'px';

  const margin = 10;
  const rightOverflow = (rect.left + menuW) - (window.innerWidth - margin);

  if(rightOverflow > 0){
    const rightAlignedLeft = rect.right - menuW;
    if(rightAlignedLeft >= margin){
      pickWrap.classList.add('align-left-edge');
      listEl.style.left = 'auto';
      listEl.style.right = '0';
    } else {
      const clampedLeft = Math.max(margin, Math.min(rect.left, window.innerWidth - menuW - margin));
      const shiftLeft = clampedLeft - rect.left;
      listEl.style.left = '0';
      listEl.style.right = 'auto';
      listEl.style.transform = 'translateX(' + Math.round(shiftLeft) + 'px)';
    }
  }
}

function updateDashboardStats(){
  const dayCells = document.querySelectorAll('.day[data-day]');
  const total = dayCells.length;
  let scheduled = 0;
  let dayoffs = 0;

  dayCells.forEach(cell => {
    const shiftVal = (cell.querySelector('.shift-select')?.value || '').toUpperCase();
    const taVal = (cell.querySelector('textarea')?.value || '').trim().toUpperCase();
    if(shiftVal === 'DAYOFF' || taVal === 'OFF'){
      dayoffs++;
    } else if(shiftVal !== '' || taVal !== ''){
      scheduled++;
    }
  });

  const open = Math.max(0, total - scheduled - dayoffs);
  const elTotal = document.getElementById('statTotalDays');
  const elSched = document.getElementById('statScheduled');
  const elOff = document.getElementById('statDayoffs');
  const elOpen = document.getElementById('statOpen');
  if(elTotal) elTotal.textContent = total;
  if(elSched) elSched.textContent = scheduled;
  if(elOff) elOff.textContent = dayoffs;
  if(elOpen) elOpen.textContent = open;
}

function setShiftUI(cell, val){
  if(!cell) return;
  const hidden = cell.querySelector('.shift-select');
  const toggle = cell.querySelector('.shift-toggle');
  if(hidden) hidden.value = val;
  if(toggle){
    toggle.textContent = (val || 'SHIFT') + ' ▾';
    toggle.classList.toggle('is-dayoff', val.toUpperCase() === 'DAYOFF');
  }
  cell.querySelectorAll('.shift-menu-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.val === val);
  });
}

function applyDayoffAppearance(shiftEl, taEl){
  const isDayoff = (shiftEl.value || '').toUpperCase() === 'DAYOFF';
  shiftEl.classList.toggle('is-dayoff', isDayoff);
  if(isDayoff){
    taEl.classList.remove('task-note-hidden');
    taEl.value = 'OFF';
    taEl.style.color = 'red';
    taEl.style.fontWeight = '700';
    taEl.style.textAlign = 'center';
  } else if(taEl.value.trim().toUpperCase() === 'OFF'){
    taEl.value = '';
    taEl.style.color = '';
    taEl.style.fontWeight = '';
    taEl.style.textAlign = document.getElementById('textAlign').value || 'left';
    taEl.classList.add('task-note-hidden');
  }
}

function render(){
  const m = +document.getElementById('month').value;
  const y = +document.getElementById('year').value;
  const offset = getEffectiveOffset(y, m);
  const daysInMonth = getDaysInMonth(y, m);

  document.getElementById('title').innerHTML = 'WORKPLAN for the Month of <strong>'+monthNames[m].toUpperCase()+'</strong> '+y;

  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    cal.append(el);
  });

  const saved = JSON.parse(localStorage.getItem(key()) || '{}');

  for(let i = 0; i < offset; i++){
    const filler = document.createElement('div');
    filler.className = 'day filler';
    cal.append(filler);
  }

  for(let day = 1; day <= daysInMonth; day++){
    const cell = document.createElement('div');
    const dowIndex = (offset + day - 1) % 7;
    cell.className = 'day' + ((dowIndex === 0 || dowIndex === 6) ? ' is-weekend' : '');
    cell.dataset.day = day;

    const n = document.createElement('div');
    n.className = 'daynum';
    n.contentEditable = 'true';
    n.textContent = saved[day]?.number ?? day;
    n.oninput = () => saveLocal();

    const headrow = document.createElement('div');
    headrow.className = 'dayhead';
    headrow.append(n);

    const shiftWrap = document.createElement('div');
    shiftWrap.className = 'shift-pick';

    const shift = document.createElement('input');
    shift.type = 'hidden';
    shift.className = 'shift-select';
    const rawSavedShift = saved[day]?.shift || '';
    shift.value = rawSavedShift.toUpperCase() === 'DAYOFF' ? 'DAYOFF' : rawSavedShift;

    const shiftToggle = document.createElement('button');
    shiftToggle.type = 'button';
    shiftToggle.className = 'shift-toggle';
    shiftToggle.textContent = (shift.value || 'SHIFT') + ' ▾';
    shiftToggle.classList.toggle('is-dayoff', shift.value === 'DAYOFF');

    const shiftMenu = document.createElement('div');
    shiftMenu.className = 'shift-menu';

    const hasShiftBoxBelow = (day + 7) <= daysInMonth;
    let shiftIncludeBelowCb = null;
    if(hasShiftBoxBelow){
      const shiftBelowBar = document.createElement('label');
      shiftBelowBar.className = 'shift-include-below-bar';
      shiftBelowBar.style.cssText = 'display:flex;align-items:center;gap:6px;padding:5px 7px;margin-bottom:3px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:10px;font-weight:600;color:#1d4ed8;cursor:pointer;white-space:nowrap;';
      shiftBelowBar.onclick = (e) => e.stopPropagation();

      shiftIncludeBelowCb = document.createElement('input');
      shiftIncludeBelowCb.type = 'checkbox';
      shiftIncludeBelowCb.className = 'shift-include-below-cb';
      shiftIncludeBelowCb.style.cssText = 'margin:0;accent-color:var(--accent);cursor:pointer;';
      if(typeof saved[day]?.shiftIncludeBelow === 'boolean'){
        shiftIncludeBelowCb.checked = saved[day].shiftIncludeBelow;
      } else {
        shiftIncludeBelowCb.checked = (day <= 7);
      }
      shiftIncludeBelowCb.onchange = (e) => {
        e.stopPropagation();
        saveLocal();
      };

      const shiftBelowTxt = document.createElement('span');
      shiftBelowTxt.textContent = (day <= 7)
        ? 'Auto-include boxes below (column)'
        : 'Include succeeding boxes below';
      shiftBelowBar.append(shiftIncludeBelowCb, shiftBelowTxt);
      shiftMenu.append(shiftBelowBar);
    }

    const shiftChoices = [
      {val: '', label: 'NONE'},
      {val: 'DAYOFF', label: 'DAYOFF'},
      {val: 'MORNING SHIFT (7AM-4PM)', label: 'MORNING SHIFT (7AM-4PM)'},
      {val: 'SWING SHIFT (3PM-12MN)', label: 'SWING SHIFT (3PM-12MN)'},
      {val: 'STRAIGHT-DUTY (7AM-12MN)', label: 'STRAIGHT-DUTY (7AM-12MN)'}
    ];

    shiftChoices.forEach(ch => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'shift-menu-item' + (ch.val === 'DAYOFF' ? ' is-dayoff-opt' : '') + (shift.value === ch.val ? ' active' : '');
      item.dataset.val = ch.val;
      item.textContent = ch.label;
      item.onclick = (e) => {
        e.stopPropagation();
        shift.value = ch.val;
        shiftWrap.classList.remove('dropdown-open');
        cell.classList.remove('dropdown-open');
        shiftMenu.style.display = 'none';
        if(typeof shift.onchange === 'function') shift.onchange();
      };
      shiftMenu.append(item);
    });

    shiftToggle.onclick = (e) => {
      e.stopPropagation();
      const willOpen = !shiftWrap.classList.contains('dropdown-open');
      document.querySelectorAll('.taskpick.dropdown-open, .shift-pick.dropdown-open').forEach(p => {
        p.classList.remove('dropdown-open');
        p.closest('.day')?.classList.remove('dropdown-open');
        const tl = p.querySelector('.tasklist');
        if(tl) tl.style.display = 'none';
        const sm = p.querySelector('.shift-menu');
        if(sm) sm.style.display = 'none';
      });
      if(willOpen){
        positionShiftMenu(shiftToggle, shiftMenu, shiftWrap, cell);
        requestAnimationFrame(() => positionShiftMenu(shiftToggle, shiftMenu, shiftWrap, cell));
      } else {
        shiftMenu.style.display = 'none';
      }
    };

    shiftWrap.append(shift, shiftToggle, shiftMenu);

    const pick = document.createElement('div');
    pick.className = 'taskpick';

    const summary = document.createElement('button');
    summary.type = 'button';
    summary.className = 'tasktoggle';
    const initialSelected = saved[day]?.selectedTasks || [];
    summary.textContent = initialSelected.length ? 'Choose task ('+initialSelected.length+' selected) ▼' : 'Choose task ▼';
    pick.append(summary);

    const list = document.createElement('div');
    list.className = 'tasklist';
    list.style.display = 'none';
    pick.append(list);

    const hasBoxBelow = (day + 7) <= daysInMonth;
    let includeBelowCb = null;
    if(hasBoxBelow){
      const belowBar = document.createElement('label');
      belowBar.className = 'include-below-bar';
      belowBar.style.cssText = 'display:flex;align-items:center;gap:7px;padding:6px 7px;margin-bottom:4px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:11px;font-weight:600;color:#1d4ed8;position:sticky;top:-8px;z-index:5;';
      includeBelowCb = document.createElement('input');
      includeBelowCb.type = 'checkbox';
      includeBelowCb.className = 'include-below-cb';
      if(typeof saved[day]?.includeBelow === 'boolean'){
        includeBelowCb.checked = saved[day].includeBelow;
      } else {
        includeBelowCb.checked = (day <= 7);
      }
      includeBelowCb.onchange = () => saveLocal();
      const belowTxt = document.createElement('span');
      belowTxt.textContent = (day <= 7)
        ? 'Auto-include boxes below (column)'
        : 'Include succeeding boxes below';
      belowBar.append(includeBelowCb, belowTxt);
      list.append(belowBar);
    }

    summary.onclick = () => {
      const isHidden = list.style.display === 'none';
      document.querySelectorAll('.taskpick.dropdown-open, .shift-pick.dropdown-open').forEach(p => {
        p.classList.remove('dropdown-open');
        p.closest('.day')?.classList.remove('dropdown-open');
        const other = p.querySelector('.tasklist');
        if(other) other.style.display = 'none';
        const sm = p.querySelector('.shift-menu');
        if(sm) sm.style.display = 'none';
      });
      if(isHidden){
        list.style.display = 'block';
        pick.classList.add('dropdown-open');
        cell.classList.add('dropdown-open');
        positionTaskDropdown(summary, list, pick);
        requestAnimationFrame(() => positionTaskDropdown(summary, list, pick));
      }
    };

    taskOptions.forEach(task => {
      const lab = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = task;
      cb.checked = initialSelected.includes(task);
      lab.append(cb, document.createTextNode(' ' + task));
      list.append(lab);
    });

    const cap = document.createElement('select');
    cap.className = 'task-capitalization';
    cap.innerHTML = '<option value="title">Auto Capitalize</option><option value="upper">UPPERCASE</option>';
    cap.value = 'upper';

    const limitNotice = document.createElement('div');
    limitNotice.className = 'dropdown-limit-notice';
    limitNotice.textContent = 'Maximum of 7 tasks only.';
    list.append(limitNotice);

    const caprow = document.createElement('div');
    caprow.className = 'task-cap-row';
    caprow.append(cap);

    const ta = document.createElement('textarea');
    ta.placeholder = 'Shift / task / notes…';
    ta.value = saved[day]?.text || '';
    if(shift.value === 'DAYOFF' || ta.value.trim().toUpperCase() === 'OFF'){
      ta.value = 'OFF';
      ta.style.color = 'red';
      ta.style.fontWeight = '700';
      ta.style.textAlign = 'center';
    } else if(!ta.value.trim()){
      ta.classList.add('task-note-hidden');
    }

    shift.onchange = () => {
      const val = shift.value;
      const fillColumn = hasShiftBoxBelow && shiftIncludeBelowCb ? shiftIncludeBelowCb.checked : false;
      const step = fillColumn ? 7 : (daysInMonth + 1);
      for(let targetDay = day; targetDay <= daysInMonth; targetDay += step){
        const targetCell = document.querySelector('.day[data-day="'+targetDay+'"]');
        const targetShift = targetCell?.querySelector('.shift-select');
        const targetTa = targetCell?.querySelector('textarea');
        if(targetShift && targetTa){
          setShiftUI(targetCell, val);
          applyDayoffAppearance(targetShift, targetTa);
          if(val === 'DAYOFF'){
            targetCell.querySelectorAll('.tasklist input[type="checkbox"]:not(.include-below-cb)').forEach(b => b.checked = false);
            const tgl = targetCell.querySelector('.tasktoggle');
            if(tgl) tgl.textContent = 'Choose task ▼';
          }
        }
      }
      saveLocal();
    };

    const apply = document.createElement('button');
    apply.type = 'button';
    apply.className = 'apply-btn';
    apply.textContent = 'Apply';
    apply.onclick = () => {
      const raw = [...list.querySelectorAll('input[type="checkbox"]:not(.include-below-cb):checked')].map(c => c.value);
      const selected = raw.map(t => cap.value === 'upper' ? t.toUpperCase() : t.replace(/\b\w/g, ch => ch.toUpperCase()));
      const currentAlign = document.getElementById('textAlign').value || 'left';

      if(selected.length){
        const bundle = selected.map(t => '-' + t).join('\n');
        const applyBelow = hasBoxBelow && includeBelowCb ? includeBelowCb.checked : false;
        const step = applyBelow ? 7 : (daysInMonth + 1);
        for(let targetDay = day; targetDay <= daysInMonth; targetDay += step){
          const targetCell = document.querySelector('.day[data-day="'+targetDay+'"]');
          const target = targetCell?.querySelector('textarea');
          const targetShiftVal = (targetCell?.querySelector('.shift-select')?.value || '').toUpperCase();
          if(target){
            const existing = target.value.trim().toUpperCase();
            const isDayOff = targetShiftVal === 'DAYOFF' || existing === 'OFF' || existing.split(/\r?\n/).some(line => line.trim() === 'OFF');
            if(targetDay !== day && isDayOff) continue;

            if(targetDay === day && targetShiftVal === 'DAYOFF'){
              setShiftUI(targetCell, '');
            }

            target.classList.remove('task-note-hidden');
            target.value = bundle;
            target.style.color = '';
            target.style.fontWeight = '';
            target.style.textAlign = currentAlign;

            const targetToggle = targetCell.querySelector('.tasktoggle');
            if(targetToggle) targetToggle.textContent = 'Choose task ('+raw.length+' selected) ▼';

            targetCell.querySelectorAll('.tasklist input[type="checkbox"]:not(.include-below-cb)').forEach(box => {
              box.checked = raw.includes(box.value);
            });
          }
        }
      } else {
        ta.value = '';
        ta.style.color = '';
        ta.style.fontWeight = '';
        ta.style.textAlign = currentAlign;
        ta.classList.add('task-note-hidden');
        summary.textContent = 'Choose task ▼';
      }

      list.style.display = 'none';
      pick.classList.remove('dropdown-open');
      pick.classList.remove('align-left-edge');
      cell.classList.remove('dropdown-open');
      saveLocal();
    };

    caprow.append(apply);
    list.append(caprow);

    ta.oninput = () => {
      ta.classList.remove('task-note-hidden');
      const isOff = ta.value.trim().toUpperCase() === 'OFF';
      ta.style.color = isOff ? 'red' : '';
      ta.style.fontWeight = isOff ? '700' : '';
      ta.style.textAlign = isOff ? 'center' : (document.getElementById('textAlign').value || 'left');
      saveLocal();
    };

    headrow.append(shiftWrap);
    cell.append(headrow, pick, ta);
    cal.append(cell);
  }

  const totalCells = offset + daysInMonth;
  const trailingCount = (7 - (totalCells % 7)) % 7;
  for(let i = 0; i < trailingCount; i++){
    const filler = document.createElement('div');
    filler.className = 'day filler';
    cal.append(filler);
  }

  let sig = document.getElementById('signatures');
  if(!sig){
    sig = document.createElement('div');
    sig.id = 'signatures';
    sig.className = 'signatures';
    cal.closest('.sheet-card').appendChild(sig);
  }
  sig.innerHTML =
    '<div class="signature"><div contenteditable="true" oninput="saveSignatures()">Prepared by:</div><div class="name" contenteditable="true" oninput="saveSignatures()"></div><div class="role" contenteditable="true" oninput="saveSignatures()">ADA VI</div></div>' +
    '<div class="signature"><div contenteditable="true" oninput="saveSignatures()">Noted by:</div><div class="name" contenteditable="true" oninput="saveSignatures()"></div><div class="role" contenteditable="true" oninput="saveSignatures()">Center Head</div></div>';

  const savedSig = JSON.parse(localStorage.getItem('workplan-signatures') || '[["Prepared by:","CHRISTOPHER C. ESTACIO","ADA VI"],["Noted by:","DIVINA P. SILOS","Center Head"]]');
  if(Array.isArray(savedSig[0])){
    sig.querySelectorAll('.signature').forEach((f, i) =>
      f.querySelectorAll('[contenteditable]').forEach((el, j) => {
        el.textContent = savedSig[i]?.[j] || ((i === 1 && j === 1) ? 'DIVINA P. SILOS' : el.textContent);
      })
    );
  }

  const savedAlign = localStorage.getItem('workplan-text-align') || 'left';
  document.getElementById('textAlign').value = savedAlign;
  syncTextAlignTap(savedAlign);
  document.documentElement.style.setProperty('--workplan-align', savedAlign);
  document.querySelectorAll('.day textarea').forEach(t => {
    if(t.value.trim().toUpperCase() !== 'OFF') t.style.textAlign = savedAlign;
  });

  updateDashboardStats();
}

function saveSignatures(){
  const sig = document.querySelectorAll('#signatures .signature');
  localStorage.setItem('workplan-signatures', JSON.stringify(Array.from(sig, s => Array.from(s.children, c => c.textContent))));
}

function saveLocal(){
  const saved = {};
  document.querySelectorAll('.day[data-day]').forEach(c => {
    const ta = c.querySelector('textarea');
    const belowBox = c.querySelector('.include-below-cb');
    const shiftBelowBox = c.querySelector('.shift-include-below-cb');
    saved[c.dataset.day] = {
      number: c.querySelector('.daynum').textContent,
      text: ta.value,
      selectedTasks: Array.from(c.querySelectorAll('.tasklist input[type="checkbox"]:not(.include-below-cb):checked'), x => x.value),
      shift: c.querySelector('.shift-select')?.value || '',
      includeBelow: belowBox ? belowBox.checked : undefined,
      shiftIncludeBelow: shiftBelowBox ? shiftBelowBox.checked : undefined
    };
  });
  localStorage.setItem(key(), JSON.stringify(saved));
  updateDashboardStats();
}

function showResetToast(msg){
  const toast = document.getElementById('taskLimitToast');
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window.__resetToastTimer);
  window.__resetToastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function clearMonth(){
  const overlay = document.getElementById('resetConfirmOverlay');
  const cancelBtn = document.getElementById('resetCancelBtn');
  const confirmBtn = document.getElementById('resetConfirmBtn');
  if(!overlay || !cancelBtn || !confirmBtn){
    localStorage.removeItem(key());
    render();
    return;
  }
  overlay.classList.add('open');
  const cleanup = () => {
    overlay.classList.remove('open');
    cancelBtn.onclick = null;
    confirmBtn.onclick = null;
    overlay.onclick = null;
  };
  cancelBtn.onclick = cleanup;
  overlay.onclick = (e) => { if(e.target === overlay) cleanup(); };
  confirmBtn.onclick = () => {
    cleanup();
    localStorage.removeItem(key());
    render();
    showResetToast('Month schedule reset.');
  };
}


function syncTextAlignTap(val){
  document.querySelectorAll('#textAlignTap button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.align === val);
  });
}

function setTextAlignTap(val){
  const hidden = document.getElementById('textAlign');
  if(hidden) hidden.value = val;
  syncTextAlignTap(val);
  applyAlign();
}

function applyAlign(){
  const a = document.getElementById('textAlign').value;
  document.documentElement.style.setProperty('--workplan-align', a);
  document.querySelectorAll('.day textarea').forEach(t => {
    if(t.value.trim().toUpperCase() !== 'OFF') t.style.textAlign = a;
  });
  localStorage.setItem('workplan-text-align', a);
  if(document.getElementById('a4PreviewModal')?.classList.contains('open')){
    buildA4PreviewSheet();
    updatePreviewScale();
  }
}

/* Shared Sheet Builder: Identical layout for Preview AND Letter/A4 Printout */
function buildSheetMarkup(){
  const titleHTML = document.getElementById('title').innerHTML;
  const align = document.getElementById('textAlign').value || 'left';
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const cells = Array.from(document.querySelectorAll('#calendar .day'));
  const totalWeeks = Math.max(1, Math.ceil(cells.length / 7));

  let gridHTML = days.map(d => '<div class="pv-dow">'+d+'</div>').join('');

  cells.forEach((cell) => {
    if(cell.classList.contains('filler')){
      gridHTML += '<div class="pv-cell"></div>';
      return;
    }
    const num = cell.querySelector('.daynum')?.textContent || '';
    const rawShiftVal = cell.querySelector('.shift-select')?.value || '';
    const isDayoffShift = rawShiftVal.toUpperCase() === 'DAYOFF';
    const shiftVal = isDayoffShift ? '' : rawShiftVal;
    const ta = cell.querySelector('textarea');
    let rawText = (ta && !ta.classList.contains('task-note-hidden')) ? ta.value.replace(/\n\n+/g, '\n').trim() : '';
    if(isDayoffShift && !rawText) rawText = 'OFF';
    const isOff = isDayoffShift || rawText.toUpperCase() === 'OFF';
    const totalChars = rawText.length;
    const lineCount = rawText ? rawText.split('\n').reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 26)), 0) : 0;
    let fontPx = computeTaskFontPx(rawText);
    if(!isOff && rawText){
      if(totalChars > 360 || lineCount > 14) fontPx = Math.max(6.2, fontPx - 0.8);
      else if(totalChars > 220 || lineCount > 10) fontPx = Math.max(6.8, fontPx - 0.5);
      else if(totalChars <= 120 && lineCount <= 4) fontPx = Math.min(11.8, fontPx + 0.6);
    }

    if(!isOff && rawText){
      const activeRows = Math.max(1, totalWeeks);
      const taskCount = rawText.split('\n').filter(l => l.trim()).length;
      if(taskCount <= 7 && activeRows <= 5){
        fontPx = Math.max(fontPx, lineCount <= 10 ? 9.8 : 8.6);
      } else if(taskCount <= 7){
        fontPx = Math.max(fontPx, 8.2);
      }
    }

    const effectiveAlign = isOff ? 'center' : align;
    const justifyContent = isOff ? 'center' : (align === 'right' ? 'flex-end' : (align === 'center' ? 'center' : 'flex-start'));
    const alignItems = 'center';
    const lineHeight = isOff ? '1.1' : (lineCount >= 9 ? '1.06' : '1.12');

    const safeNum = num.replace(/</g,'&lt;');
    const safeShift = shiftVal.replace(/</g,'&lt;');
    const safeBody = rawText.replace(/&/g,'&amp;').replace(/</g,'&lt;');

    gridHTML += '<div class="pv-cell">' +
      '<div class="pv-head">' +
        '<span class="pv-num">'+safeNum+'</span>' +
        (safeShift ? '<span class="pv-shift">'+safeShift+'</span>' : '') +
      '</div>' +
      (safeBody ? '<div class="pv-body'+(isOff?' is-off':'')+'" style="font-size:'+fontPx+'px;line-height:'+lineHeight+';text-align:'+effectiveAlign+';justify-content:'+justifyContent+';align-items:'+alignItems+';padding-left:'+(isOff ? '0' : (effectiveAlign === 'left' ? '5px' : '0'))+';padding-right:'+(isOff ? '0' : (effectiveAlign === 'right' ? '5px' : '0'))+';"><div class="pv-body-inner" style="width:100%;text-align:'+effectiveAlign+';">'+safeBody+'</div></div>' : '') +
    '</div>';
  });

  const sigEls = document.querySelectorAll('#signatures .signature');
  let sigHTML = '';
  sigEls.forEach(s => {
    const parts = s.querySelectorAll('[contenteditable]');
    const lbl = (parts[0]?.textContent || '').replace(/</g,'&lt;');
    const nm = (parts[1]?.textContent || '').replace(/</g,'&lt;');
    const rl = (parts[2]?.textContent || '').replace(/</g,'&lt;');
    sigHTML += '<div class="pv-sig"><div>'+lbl+'</div><div class="pv-sig-name">'+nm+'</div><div>'+rl+'</div></div>';
  });

  return '<div class="pv-title">'+titleHTML+'</div>' +
    '<div class="pv-grid" style="grid-template-rows:7mm repeat('+totalWeeks+',minmax(0,1fr))">'+gridHTML+'</div>' +
    '<div class="pv-sigs">'+sigHTML+'</div>';
}

/* Responsive A4 Landscape Print Preview Logic (Phone & Desktop) */
let currentPreviewZoom = 'fit';
let currentPreviewViewport = 'desktop';


function fitPreviewSheetTextSizes(root){
  if(!root) return;
  const bodies = root.querySelectorAll('.pv-body');
  bodies.forEach(body => {
    const cell = body.closest('.pv-cell');
    if(!cell || cell.classList.contains('pv-empty-row-cell')) return;
    const inner = body.querySelector('.pv-body-inner') || body;
    const head = cell.querySelector('.pv-head');
    const cellStyles = getComputedStyle(cell);
    const padTop = parseFloat(cellStyles.paddingTop) || 0;
    const padBot = parseFloat(cellStyles.paddingBottom) || 0;
    const headH = head ? head.getBoundingClientRect().height : 0;
    const availableH = Math.max(10, cell.clientHeight - padTop - padBot - headH - 2);
    const availableW = Math.max(18, (body.clientWidth || (cell.clientWidth - 4)) - 2);

    let currentPx = parseFloat(body.style.fontSize) || 10.5;
    const minPx = body.classList.contains('is-off') ? 8.5 : 4.6;

    body.style.fontSize = currentPx + 'px';
    let guard = 0;
    while(guard < 160 && currentPx > minPx){
      const tooTall = inner.scrollHeight > availableH;
      const tooWide = inner.scrollWidth > availableW;
      if(!tooTall && !tooWide) break;
      currentPx = Math.max(minPx, +(currentPx - 0.15).toFixed(2));
      body.style.fontSize = currentPx + 'px';
      guard++;
    }
    if(inner.scrollHeight > availableH){
      body.style.lineHeight = '1.02';
    }
  });
}

function buildA4PreviewSheet(){
  const mount = document.getElementById('a4SheetMount');
  mount.innerHTML = buildSheetMarkup();
  fitPreviewSheetTextSizes(mount);
}

function updatePreviewScale(){
  const modal = document.getElementById('a4PreviewModal');
  if(!modal.classList.contains('open')) return;
  const stage = document.getElementById('previewStage');
  const frame = document.getElementById('previewDeviceFrame');
  const scaler = document.getElementById('previewScaler');
  const sheet = document.getElementById('a4SheetMount');

  const isPhoneSim = currentPreviewViewport === 'phone' && window.innerWidth > 800;
  stage.classList.toggle('is-phone-sim', isPhoneSim);
  frame.classList.toggle('phone-mode', isPhoneSim);

  const sheetW = sheet.offsetWidth || 1122.5;
  const sheetH = sheet.offsetHeight || 793.7;
  let scale = 1;

  if(currentPreviewZoom === 'fit'){
    const container = isPhoneSim ? frame : stage;
    const padX = isPhoneSim ? 24 : 36;
    const padY = isPhoneSim ? 44 : 36;
    const availW = Math.max(220, container.clientWidth - padX);
    const availH = Math.max(180, container.clientHeight - padY);
    scale = Math.min(availW / sheetW, availH / sheetH, 1.15);
  } else {
    scale = Number(currentPreviewZoom) || 1;
  }

  sheet.style.transform = 'scale('+scale+')';
  scaler.style.width = Math.round(sheetW * scale) + 'px';
  scaler.style.height = Math.round(sheetH * scale) + 'px';
}

function setPreviewViewport(vp){
  currentPreviewViewport = vp;
  document.querySelectorAll('#previewViewportControls button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.vp === vp);
  });
  updatePreviewScale();
}

function setPreviewZoom(z){
  currentPreviewZoom = z;
  document.querySelectorAll('#previewZoomControls button').forEach(btn => {
    btn.classList.toggle('active', String(btn.dataset.zoom) === String(z));
  });
  updatePreviewScale();
}

function openA4Preview(){
  buildA4PreviewSheet();
  const modal = document.getElementById('a4PreviewModal');
  modal.classList.add('open');
  setPreviewViewport('desktop');
  setPreviewZoom('fit');
}

function closeA4Preview(){
  document.getElementById('a4PreviewModal').classList.remove('open');
}

function triggerExactPrint(){
  const wrapper = document.getElementById('printSheetWrapper');
  wrapper.innerHTML = '<div class="a4-sheet">' + buildSheetMarkup() + '</div>';
  fitPreviewSheetTextSizes(wrapper);
  window.print();
}

function printFromPreview(){
  closeA4Preview();
  setTimeout(() => triggerExactPrint(), 60);
}

window.addEventListener('resize', () => {
  updatePreviewScale();
  document.querySelectorAll('.taskpick.dropdown-open').forEach(p => {
    const tgl = p.querySelector('.tasktoggle');
    const tl = p.querySelector('.tasklist');
    if(tgl && tl && tl.style.display !== 'none') positionTaskDropdown(tgl, tl, p);
  });
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeA4Preview();
});

// Close task dropdowns when clicking outside
document.addEventListener('click', function(event){
  if(!event.target.closest('.taskpick')){
    document.querySelectorAll('.taskpick.dropdown-open').forEach(function(p){
      p.classList.remove('dropdown-open');
      p.classList.remove('align-left-edge');
      p.closest('.day')?.classList.remove('dropdown-open');
      const list = p.querySelector('.tasklist');
      if(list){
        list.style.display = 'none';
        list.style.transform = '';
      }
    });
  }
  if(!event.target.closest('.shift-pick')){
    document.querySelectorAll('.shift-pick.dropdown-open').forEach(function(p){
      p.classList.remove('dropdown-open');
      p.closest('.day')?.classList.remove('dropdown-open');
      const sm = p.querySelector('.shift-menu');
      if(sm) sm.style.display = 'none';
    });
  }
});

window.addEventListener('scroll', function(e){
  if(e.target && e.target.closest && e.target.closest('.shift-menu')) return;
  if(e.target && e.target.closest && e.target.closest('.tasklist')) return;
  document.querySelectorAll('.taskpick.dropdown-open').forEach(function(p){
    const tgl = p.querySelector('.tasktoggle');
    const tl = p.querySelector('.tasklist');
    if(tgl && tl && tl.style.display !== 'none') positionTaskDropdown(tgl, tl, p);
  });
  document.querySelectorAll('.shift-pick.dropdown-open').forEach(function(p){
    const toggle = p.querySelector('.shift-toggle');
    const menu = p.querySelector('.shift-menu');
    if(!toggle || !menu) return;
    const rect = toggle.getBoundingClientRect();
    const headerEl = document.querySelector('header');
    const headerBottom = headerEl ? Math.max(0, headerEl.getBoundingClientRect().bottom) : 0;
    if(rect.bottom <= headerBottom + 2 || rect.top >= window.innerHeight - 6){
      p.classList.remove('dropdown-open');
      p.closest('.day')?.classList.remove('dropdown-open');
      menu.style.display = 'none';
      return;
    }
    positionShiftMenu(toggle, menu, p, p.closest('.day'));
  });
}, true);

// 7-task maximum limit enforcement (notification appears right above the last clicked checkbox)
(function(){
  let activeTip = null;
  let hideTimer = null;

  function removeTip(){
    if(hideTimer){
      clearTimeout(hideTimer);
      hideTimer = null;
    }
    if(activeTip && activeTip.parentNode){
      activeTip.parentNode.removeChild(activeTip);
    }
    activeTip = null;
  }

  function showAboveCheckbox(cb){
    removeTip();
    const row = cb.closest('label') || cb;
    const tip = document.createElement('div');
    tip.className = 'task-click-limit-tip';
    tip.textContent = 'Maximum of 7 tasks only.';
    tip.style.cssText = 'position:fixed;z-index:100000;background:#dc2626;color:#ffffff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;box-shadow:0 6px 16px rgba(15,23,42,0.25);pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);';
    document.body.appendChild(tip);

    const rect = row.getBoundingClientRect();
    let left = rect.left + Math.min(rect.width * 0.5, 70);
    const tipW = tip.offsetWidth || 135;
    left = Math.max(8 + tipW / 2, Math.min(window.innerWidth - 8 - tipW / 2, left));
    let top = rect.top - 6;
    if(top < 28){
      top = rect.bottom + 6;
      tip.style.transform = 'translate(-50%,0)';
    }
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    activeTip = tip;

    hideTimer = setTimeout(removeTip, 1800);
  }

  document.addEventListener('change', function(e){
    const cb = e.target;
    if(!cb.matches('.tasklist input[type="checkbox"]:not(.include-below-cb)') || !cb.checked) return;
    const list = cb.closest('.tasklist');
    if(list && list.querySelectorAll('input[type="checkbox"]:not(.include-below-cb):checked').length > 7){
      cb.checked = false;
      showAboveCheckbox(cb);
    }
  });

  document.addEventListener('scroll', removeTip, true);
  window.addEventListener('resize', removeTip);
})();

// Keep print wrapper synced even if Ctrl+P / browser print is triggered directly
window.addEventListener('beforeprint', function(){
  const wrapper = document.getElementById('printSheetWrapper');
  if(wrapper && !wrapper.innerHTML.trim()){
    wrapper.innerHTML = '<div class="a4-sheet">' + buildSheetMarkup() + '</div>';
    fitPreviewSheetTextSizes(wrapper);
  }
});
window.addEventListener('afterprint', function(){
  const wrapper = document.getElementById('printSheetWrapper');
  if(wrapper) wrapper.innerHTML = '';
});

// Initialize on current real month & year while preserving saved data in localStorage
(function init(){
  const now = new Date();
  const ySel = document.getElementById('year');
  const mSel = document.getElementById('month');
  if([...ySel.options].some(o => Number(o.value) === now.getFullYear())){
    ySel.value = String(now.getFullYear());
  }
  mSel.value = String(now.getMonth());
  render();
})();
</script>
