<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editable Workplan Calendar</title><style>
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface-subtle:#f1f5f9;
  --ink:#0f172a;
  --ink-secondary:#334155;
  --muted:#64748b;
  --line:#e2e8f0;
  --line-strong:#cbd5e1;
  --accent:#2563eb;
  --accent-hover:#1d4ed8;
  --accent-soft:#eff6ff;
  --danger:#dc2626;
  --danger-soft:#fef2f2;
  --success:#16a34a;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --shadow-xs:0 1px 2px rgba(15,23,42,0.04);
  --shadow-sm:0 4px 12px rgba(15,23,42,0.05);
  --shadow-lg:0 20px 40px rgba(15,23,42,0.14);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* Minimalist Sticky Top Bar */
header{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px clamp(16px,3vw,32px);
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.brand-block{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.brand-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--ink);
  color:#ffffff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:var(--shadow-xs);
}
.brand-text{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
header h1{
  font-size:1.02rem;
  margin:0;
  font-weight:700;
  letter-spacing:-0.02em;
  color:var(--ink);
  line-height:1.2;
}
.header-slogan{
  font-size:12px;
  font-weight:500;
  color:var(--muted);
}
.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

/* Vibrant Dashboard Buttons */
button,.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid transparent;
  background:var(--accent);
  color:#ffffff;
  border-radius:var(--radius-sm);
  padding:8px 14px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  line-height:1.2;
  transition:all .15s ease;
  box-shadow:var(--shadow-xs);
}
button:hover{background:var(--accent-hover);transform:translateY(-0.5px)}
button:active{transform:translateY(0)}

button.btn-preview{
  background:#4f46e5;
  border-color:#4f46e5;
  color:#ffffff;
}
button.btn-preview:hover{
  background:#4338ca;
  border-color:#4338ca;
}
button.btn-save{
  background:#2563eb;
  border-color:#2563eb;
  color:#ffffff;
}
button.btn-save:hover{
  background:#1d4ed8;
  border-color:#1d4ed8;
}
button.btn-print{
  background:#16a34a;
  border-color:#16a34a;
  color:#ffffff;
}
button.btn-print:hover{
  background:#15803d;
  border-color:#15803d;
}
button.btn-reset{
  background:#dc2626;
  border-color:#dc2626;
  color:#ffffff;
}
button.btn-reset:hover{
  background:#b91c1c;
  border-color:#b91c1c;
}
button.secondary{
  background:#334155;
  border-color:#475569;
  color:#ffffff;
}
button.secondary:hover{
  background:#475569;
}

/* Dashboard Main Container */
.wrap{
  max-width:1480px;
  margin:0 auto;
  padding:20px clamp(14px,3vw,32px) 40px;
}

/* Top Toolbar + Live Summary Strip */
.dashboard-bar{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);
  gap:14px;
  margin-bottom:18px;
  align-items:stretch;
}
.controls{
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-xs);
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  align-items:end;
}
.controls label{
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--muted);
}
.controls select,.controls input{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  background:var(--bg);
  color:var(--ink);
  font-size:13.5px;
  font-weight:500;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.controls select:hover,.controls input:hover{
  border-color:#94a3b8;
  background:var(--surface);
}
.controls select:focus,.controls input:focus{
  outline:none;
  background:var(--surface);
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

/* Minimalist KPI Summary Strip */
.stats-strip{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-xs);
  padding:12px 16px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  align-items:center;
}
.stat-item{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:4px 8px;
  border-left:1px solid var(--line);
}
.stat-item:first-child{border-left:0;padding-left:2px}
.stat-label{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.stat-value{
  font-size:1.15rem;
  font-weight:700;
  color:var(--ink);
  letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
}
.stat-value.is-blue{color:var(--accent)}
.stat-value.is-red{color:var(--danger)}
.stat-value.is-muted{color:var(--muted)}

/* Workspace Card */
.sheet-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:18px;
}
.monthtitle{
  text-align:center;
  font-size:1.2rem;
  font-weight:400;
  color:var(--ink-secondary);
  margin:2px 0 16px;
  letter-spacing:-0.01em;
}
.monthtitle strong{
  color:var(--ink);
  font-weight:700;
}

.calendar-scroll{
  width:100%;
  overflow:visible;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  overflow:visible;
}
.dow{
  padding:10px 6px;
  text-align:center;
  background:var(--bg);
  color:var(--muted);
  font-weight:650;
  font-size:11px;
  letter-spacing:0.05em;
  text-transform:uppercase;
}
.dow:first-child{border-top-left-radius:11px}
.dow:nth-child(7){border-top-right-radius:11px}

.day{
  min-height:148px;
  background:var(--surface);
  padding:8px;
  position:relative;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:visible;
  min-width:0;
  transition:background .12s ease;
}
.day:hover{background:#fcfdff}
.day.is-weekend{background:#fafbfd}
.day.filler{
  background:#f8fafc;
}
.dayhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  min-width:0;
  width:100%;
}
.daynum{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 5px;
  border-radius:6px;
  background:var(--surface-subtle);
  font-size:0.8rem;
  font-weight:700;
  color:var(--ink-secondary);
  outline:none;
  flex:0 0 auto;
}
.daynum:focus{
  background:var(--accent-soft);
  color:var(--accent);
}
.shift-select{
  flex:1 1 auto;
  width:0;
  min-width:0;
  max-width:100%;
  margin:0;
  padding:3px 4px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--accent);
  font-size:clamp(7.5px,0.66vw,9.5px);
  font-weight:600;
  font-style:italic;
  text-align:center;
  text-align-last:center;
  line-height:1.15;
  cursor:pointer;
  transition:all .12s ease;
}
.shift-select:hover,.shift-select:focus{
  background:var(--accent-soft);
  border-color:#dbeafe;
  outline:none;
}
.shift-select.is-dayoff{
  color:var(--danger);
  font-weight:700;
  background:var(--danger-soft);
}

.taskpick{
  width:100%;
  font-size:11px;
  position:relative;
  z-index:20;
}
.day.dropdown-open{z-index:1000}
.taskpick.dropdown-open{z-index:1001}
.taskpick.dropdown-open .tasklist{z-index:1002}
.tasktoggle{
  width:100%;
  cursor:pointer;
  border:1px solid var(--line);
  padding:5px 8px;
  background:var(--bg);
  color:var(--ink-secondary);
  font-size:11px;
  border-radius:7px;
  text-align:left;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:none;
}
.tasktoggle:hover{
  border-color:#94a3b8;
  background:var(--surface);
  transform:none;
}
.taskpick .tasklist{
  position:absolute;
  left:0;
  top:calc(100% + 5px);
  z-index:999;
  background:var(--surface);
  border:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg);
  width:min(280px,88vw);
  max-height:260px;
  overflow-y:auto;
  padding:8px 8px 0;
  font-size:11.5px;
  border-radius:var(--radius-md);
}
.taskpick label{
  display:flex;
  align-items:flex-start;
  gap:8px;
  white-space:normal;
  padding:6px 6px;
  border-bottom:1px solid var(--surface-subtle);
  line-height:1.35;
  color:var(--ink-secondary);
  border-radius:6px;
  cursor:pointer;
}
.taskpick label:hover{background:var(--bg)}
.taskpick input[type="checkbox"]{
  margin:2px 0 0;
  accent-color:var(--accent);
  flex-shrink:0;
}
.task-cap-row{
  position:sticky;
  bottom:0;
  z-index:10;
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:6px;
  margin:6px -8px 0;
  padding:8px;
  border-top:1px solid var(--line);
  box-shadow:0 -4px 10px rgba(15,23,42,0.05);
}
.task-capitalization{
  flex:1;
  padding:5px 7px;
  border:1px solid var(--line-strong);
  border-radius:6px;
  background:var(--bg);
  color:var(--ink-secondary);
  font-size:11px;
  font-weight:500;
}
.taskpick .tasklist button.apply-btn{
  padding:6px 11px;
  border-radius:6px;
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  font-size:11px;
  font-weight:600;
}

.day textarea{
  width:100%;
  max-width:100%;
  height:90px;
  min-height:90px;
  max-height:90px;
  resize:vertical;
  border:1px solid transparent;
  border-radius:7px;
  padding:5px 6px;
  background:transparent;
  font:inherit;
  font-size:11.5px;
  line-height:1.3;
  color:var(--ink);
  outline:none;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
}
.day textarea:focus{
  border-color:#93c5fd;
  background:var(--accent-soft);
}
.day textarea.task-note-hidden{
  display:none !important;
}

/* Minimalist Signatory Cards */
.signatures{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:18px;
  font-size:9.5pt;
  color:var(--ink);
}
.signature{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 16px;
  text-align:center;
}
.signature [contenteditable="true"]{outline:none;border-radius:4px}
.signature [contenteditable="true"]:focus{background:var(--accent-soft)}
.signature > div:first-child{
  font-size:11.5px;
  color:var(--muted);
  font-weight:500;
}
.signature .name{
  display:inline-block;
  min-width:190px;
  min-height:20px;
  border-bottom:1.5px solid var(--ink);
  font-weight:700;
  margin-top:18px;
  padding:0 10px 3px;
  letter-spacing:0.01em;
}
.signature .role{
  margin-top:4px;
  font-size:12px;
  color:var(--ink-secondary);
  font-weight:500;
}

#taskLimitToast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:9px 16px;
  border-radius:999px;
  font-size:12.5px;
  font-weight:600;
  z-index:99999;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
  box-shadow:var(--shadow-lg);
}
#taskLimitToast.show{opacity:1}

/* Responsive A4 Landscape Preview Modal (Phone & Desktop) */
.preview-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,0.88);
  backdrop-filter:blur(6px);
  z-index:50000;
  display:none;
  flex-direction:column;
  height:100dvh;
}
.preview-overlay.open{display:flex}
.preview-bar{
  background:#0f172a;
  color:#f8fafc;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:1px solid #1e293b;
  flex-shrink:0;
}
.preview-bar-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13.5px;
  font-weight:650;
}
.preview-badge{
  background:#1e293b;
  border:1px solid #334155;
  color:#93c5fd;
  font-size:11px;
  padding:3px 9px;
  border-radius:999px;
  white-space:nowrap;
}
.preview-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.preview-seg-group{
  display:inline-flex;
  align-items:center;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:8px;
  padding:2px;
  gap:2px;
}
.preview-seg-group button{
  background:transparent;
  border-color:transparent;
  color:#cbd5e1;
  padding:5px 9px;
  font-size:12px;
  border-radius:6px;
  white-space:nowrap;
  box-shadow:none;
}
.preview-seg-group button.active,.preview-seg-group button:hover{
  background:#334155;
  color:#fff;
  transform:none;
}
.preview-stage{
  flex:1;
  min-height:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:18px;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
}
.preview-stage.is-phone-sim{
  justify-content:center;
  background:radial-gradient(circle at top,#1e293b 0%,#0b1120 100%);
}
.preview-device-frame{
  margin:auto;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  transition:all .2s ease;
}
.preview-device-frame.phone-mode{
  width:390px;
  max-width:100%;
  min-height:720px;
  max-height:100%;
  background:#090d16;
  border:10px solid #334155;
  border-radius:36px;
  padding:26px 10px 18px;
  box-shadow:0 28px 70px rgba(0,0,0,0.65),inset 0 0 0 2px #1e293b;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  position:relative;
  display:block;
}
.preview-device-frame.phone-mode::before{
  content:"";
  position:sticky;
  top:-16px;
  display:block;
  width:96px;
  height:5px;
  background:#475569;
  border-radius:999px;
  margin:0 auto 12px;
  z-index:5;
}
.preview-scaler{
  position:relative;
  flex-shrink:0;
  margin:0 auto;
}
/* Exact A4 Landscape Sheet (297mm x 210mm) */
.a4-sheet{
  position:absolute;
  top:0;
  left:0;
  transform-origin:top left;
  width:297mm;
  height:210mm;
  background:#ffffff;
  color:#111111;
  padding:6mm;
  box-shadow:0 24px 60px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-sizing:border-box;
  overflow:hidden;
}
.a4-sheet .pv-title{
  text-align:center;
  font-size:10.5pt;
  line-height:1.15;
  margin:0 0 3mm;
  color:#111;
}
.a4-sheet .pv-title strong{font-weight:700}
.a4-sheet .pv-grid{
  width:100%;
  flex:1 1 auto;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:7mm repeat(6,minmax(0,1fr));
  border-top:0.5px solid #444;
  border-left:0.5px solid #444;
}
.a4-sheet .pv-dow,
.a4-sheet .pv-cell{
  border-right:0.5px solid #444;
  border-bottom:0.5px solid #444;
  box-sizing:border-box;
  overflow:hidden;
  min-width:0;
}
.a4-sheet .pv-dow{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8pt;
  font-weight:600;
  color:#111;
  background:#fff;
}
.a4-sheet .pv-cell{
  padding:1.1mm 1.3mm;
  display:flex;
  flex-direction:column;
}
.a4-sheet .pv-cell.pv-empty-row-cell{
  display:none;
}
.a4-sheet .pv-head{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:3.6mm;
  margin-bottom:0.4mm;
}
.a4-sheet .pv-num{
  position:absolute;
  left:0;
  top:0;
  font-size:7.5pt;
  line-height:1;
  color:#111;
}
.a4-sheet .pv-shift{
  font-size:5.4pt;
  line-height:1.05;
  font-style:italic;
  color:#2563eb;
  text-align:center;
  padding-left:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.a4-sheet .pv-body{
  flex:1;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-height:1.08;
  color:#111;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.a4-sheet .pv-body.is-off{
  color:#ff0000;
  text-align:center !important;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}
.a4-sheet .pv-sigs{
  width:100%;
  margin-top:3.5mm;
  display:flex;
  justify-content:space-between;
  font-size:8.5pt;
  color:#111;
}
.a4-sheet .pv-sig{
  width:44%;
  text-align:center;
}
.a4-sheet .pv-sig-name{
  display:inline-block;
  font-weight:700;
  text-decoration:underline;
  text-underline-offset:2px;
  margin:5mm auto 1mm;
}

@media(max-width:1024px){
  .dashboard-bar{grid-template-columns:1fr}
}

@media(max-width:800px){
  header{padding:10px 14px}
  header h1{font-size:0.96rem}
  .wrap{padding:14px 12px 24px}
  .controls{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px}
  .stats-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat-item:nth-child(3){border-left:0;padding-left:2px}
  .sheet-card{padding:12px;border-radius:12px}
  .calendar-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .calendar{grid-template-columns:repeat(7,minmax(126px,1fr));width:max-content;min-width:100%}
  .day{min-width:126px}
  .signatures{grid-template-columns:1fr;gap:10px}
  .signature .name{min-width:150px}

  /* Mobile-friendly preview toolbar */
  .preview-bar{padding:8px 10px;gap:8px}
  .preview-bar-title{width:100%;justify-content:space-between}
  .preview-actions{width:100%;justify-content:space-between;gap:6px}
  #previewViewportControls{display:none}
  .preview-seg-group button{padding:6px 8px;font-size:11.5px;min-height:34px}
  .preview-actions > button{padding:7px 10px;font-size:12px;min-height:34px;flex:1}
  .preview-stage{padding:10px}
}
@media(max-width:480px){
  header{flex-direction:column;align-items:stretch;gap:10px}

<script>
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
const taskOptions=[
  'Roving and monitoring the assigned area',
  'Inspecting facilities',
  'Inspecting facilities in the assigned area',
  'Minor electrical repairs',
  'Grass-cutting and cleaning of the assigned area',
  'Minor repair of water faucets',
  'Watering plants',
  'Watering vegetables',
  'Cleaning the front and backyard surroundings',
  'Cleaning gutters',
  'Tree Branch Trimming',
  'Water Pipe Repair',
  'Roof Repair',
  'Canal Repair',
  'Canal Cleaning',
  'Vegetable & Ornamental Planting',
  'Public CR Cleaning',
  'Soil Cultivation',
  'Weed Removal',
  'Garden Maintenance',
  'Pathway Clearing',
  'Facility Repair',
  'Drainage Maintenance',
  'Debris Disposal',
  'Garbage Bin Repair',
  'Waste Segregation & Disposal',
  'Garbage Area Cleaning',
  'CCTV Maintenance',
  'CCTV Monitoring',
  'Computer Maintenance',
  'Computer Repair',
  'Printer Maintenance',
  'Printer Repair',
  'IT & Network Support',
  'Technical Support',
  'Cleaning Around the Area'
];

function key(){
  return 'workplan-'+document.getElementById('year').value+'-'+document.getElementById('month').value;
}

function getEffectiveOffset(y, m){
  return new Date(y, m, 1).getDay();
}

function getDaysInMonth(y, m){
  return new Date(y, m + 1, 0).getDate();
}

function computeTaskFontPx(text){
  if(!text || !text.trim()) return 8.2;
  const lines = text.split('
').reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 28)), 0);
  if(lines >= 12) return 5.8;
  if(lines >= 10) return 6.2;
  if(lines >= 8) return 6.8;
  if(lines >= 6) return 7.4;
  return 8.0;
}

function updateDashboardStats(){
  const dayCells = document.querySelectorAll('.day[data-day]');
  const total = dayCells.length;
  let scheduled = 0;
  let dayoffs = 0;

  dayCells.forEach(cell => {
    const shiftVal = (cell.querySelector('.shift-select')?.value || '').toUpperCase();
    const taVal = (cell.querySelector('textarea')?.value || '').trim().toUpperCase();
    if(shiftVal === 'DAYOFF' || taVal === 'OFF'){
      dayoffs++;
    } else if(shiftVal !== '' || taVal !== ''){
      scheduled++;
    }
  });

  const open = Math.max(0, total - scheduled - dayoffs);
  const elTotal = document.getElementById('statTotalDays');
  const elSched = document.getElementById('statScheduled');
  const elOff = document.getElementById('statDayoffs');
  const elOpen = document.getElementById('statOpen');
  if(elTotal) elTotal.textContent = total;
  if(elSched) elSched.textContent = scheduled;
  if(elOff) elOff.textContent = dayoffs;
  if(elOpen) elOpen.textContent = open;
}

function applyDayoffAppearance(shiftEl, taEl){
  const isDayoff = (shiftEl.value || '').toUpperCase() === 'DAYOFF';
  shiftEl.classList.toggle('is-dayoff', isDayoff);
  if(isDayoff){
    taEl.classList.remove('task-note-hidden');
    taEl.value = 'OFF';
    taEl.style.color = 'red';
    taEl.style.fontWeight = '700';
    taEl.style.textAlign = 'center';
  } else if(taEl.value.trim().toUpperCase() === 'OFF'){
    taEl.value = '';
    taEl.style.color = '';
    taEl.style.fontWeight = '';
    taEl.style.textAlign = document.getElementById('textAlign').value || 'left';
    taEl.classList.add('task-note-hidden');
  }
}

function render(){
  const m = +document.getElementById('month').value;
  const y = +document.getElementById('year').value;
  const offset = getEffectiveOffset(y, m);
  const daysInMonth = getDaysInMonth(y, m);

  document.getElementById('title').innerHTML = 'WORKPLAN for the Month of <strong>'+monthNames[m].toUpperCase()+'</strong> '+y;

  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    cal.append(el);
  });

  const saved = JSON.parse(localStorage.getItem(key()) || '{}');

  for(let i = 0; i < offset; i++){
    const filler = document.createElement('div');
    filler.className = 'day filler';
    cal.append(filler);
  }

  for(let day = 1; day <= daysInMonth; day++){
    const cell = document.createElement('div');
    const dowIndex = (offset + day - 1) % 7;
    cell.className = 'day' + ((dowIndex === 0 || dowIndex === 6) ? ' is-weekend' : '');
    cell.dataset.day = day;

    const n = document.createElement('div');
    n.className = 'daynum';
    n.contentEditable = 'true';
    n.textContent = saved[day]?.number ?? day;
    n.oninput = () => saveLocal();

    const headrow = document.createElement('div');
    headrow.className = 'dayhead';
    headrow.append(n);

    const shift = document.createElement('select');
    shift.className = 'shift-select';
    shift.innerHTML = '<option value="">SELECT SHIFT…</option><option value="DAYOFF">DAYOFF</option><option value="MORNING SHIFT (7AM-4PM)">MORNING SHIFT (7AM-4PM)</option><option value="SWING SHIFT (3PM-12MN)">SWING SHIFT (3PM-12MN)</option><option value="STRAIGHT-DUTY (7AM-12MN)">STRAIGHT-DUTY (7AM-12MN)</option>';
    const rawSavedShift = saved[day]?.shift || '';
    shift.value = rawSavedShift.toUpperCase() === 'DAYOFF' ? 'DAYOFF' : rawSavedShift;
    shift.classList.toggle('is-dayoff', shift.value === 'DAYOFF');

    const pick = document.createElement('div');
    pick.className = 'taskpick';

    const summary = document.createElement('button');
    summary.type = 'button';
    summary.className = 'tasktoggle';
    const initialSelected = saved[day]?.selectedTasks || [];
    summary.textContent = initialSelected.length ? 'Choose task ('+initialSelected.length+' selected) ▼' : 'Choose task ▼';
    pick.append(summary);

    const list = document.createElement('div');
    list.className = 'tasklist';
    list.style.display = 'none';
    pick.append(list);

    summary.onclick = () => {
      const isHidden = list.style.display === 'none';
      document.querySelectorAll('.taskpick.dropdown-open').forEach(p => {
        p.classList.remove('dropdown-open');
        p.closest('.day')?.classList.remove('dropdown-open');
        const other = p.querySelector('.tasklist');
        if(other) other.style.display = 'none';
      });
      if(isHidden){
        list.style.display = 'block';
        pick.classList.add('dropdown-open');
        cell.classList.add('dropdown-open');
      }
    };

    taskOptions.forEach(task => {
      const lab = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = task;
      cb.checked = initialSelected.includes(task);
      lab.append(cb, document.createTextNode(' ' + task));
      list.append(lab);
    });

    const cap = document.createElement('select');
    cap.className = 'task-capitalization';
    cap.innerHTML = '<option value="title">Auto Capitalize</option><option value="upper">UPPERCASE</option>';
    cap.value = 'upper';

    const caprow = document.createElement('div');
    caprow.className = 'task-cap-row';
    caprow.append(cap);

    const ta = document.createElement('textarea');
    ta.placeholder = 'Shift / task / notes…';
    ta.value = saved[day]?.text || '';
    if(shift.value === 'DAYOFF' || ta.value.trim().toUpperCase() === 'OFF'){
      ta.value = 'OFF';
      ta.style.color = 'red';
      ta.style.fontWeight = '700';
      ta.style.textAlign = 'center';
    } else if(!ta.value.trim()){
      ta.classList.add('task-note-hidden');
    }

    shift.onchange = () => {
      const val = shift.value;
      for(let targetDay = day; targetDay <= daysInMonth; targetDay += 7){
        const targetCell = document.querySelector('.day[data-day="'+targetDay+'"]');
        const targetShift = targetCell?.querySelector('.shift-select');
        const targetTa = targetCell?.querySelector('textarea');
        if(targetShift && targetTa){
          targetShift.value = val;
          applyDayoffAppearance(targetShift, targetTa);
          if(val === 'DAYOFF'){
            targetCell.querySelectorAll('.tasklist input[type="checkbox"]').forEach(b => b.checked = false);
            const tgl = targetCell.querySelector('.tasktoggle');
            if(tgl) tgl.textContent = 'Choose task ▼';
          }
        }
      }
      saveLocal();
    };

    const apply = document.createElement('button');
    apply.type = 'button';
    apply.className = 'apply-btn';
    apply.textContent = 'Apply';
    apply.onclick = () => {
      const raw = [...list.querySelectorAll('input:checked')].map(c => c.value);
      const selected = raw.map(t => cap.value === 'upper' ? t.toUpperCase() : t.replace(/ \w/g, ch => ch.toUpperCase()));
      const currentAlign = document.getElementById('textAlign').value || 'left';

      if(selected.length){
        const bundle = selected.map(t => '- ' + t).join('
');
        for(let targetDay = day; targetDay <= daysInMonth; targetDay += 7){
          const targetCell = document.querySelector('.day[data-day="'+targetDay+'"]');
          const target = targetCell?.querySelector('textarea');
          const targetShiftVal = (targetCell?.querySelector('.shift-select')?.value || '').toUpperCase();
          if(target){
            const existing = target.value.trim().toUpperCase();
            const isDayOff = targetShiftVal === 'DAYOFF' || existing === 'OFF' || existing.split(/
/).some(line => line.trim() === 'OFF');
            if(targetDay !== day && isDayOff) continue;

            if(targetDay === day && targetShiftVal === 'DAYOFF'){
              const sh = targetCell.querySelector('.shift-select');
              if(sh){
                sh.value = '';
                sh.classList.remove('is-dayoff');
              }
            }

            target.classList.remove('task-note-hidden');
            target.value = bundle;
            target.style.color = '';
            target.style.fontWeight = '';
            target.style.textAlign = currentAlign;

            const targetToggle = targetCell.querySelector('.tasktoggle');
            if(targetToggle) targetToggle.textContent = 'Choose task ('+raw.length+' selected) ▼';

            targetCell.querySelectorAll('.tasklist input[type="checkbox"]').forEach(box => {
              box.checked = raw.includes(box.value);
            });
          }
        }
      } else {
        ta.value = '';
        ta.style.color = '';
        ta.style.fontWeight = '';
        ta.style.textAlign = currentAlign;
        ta.classList.add('task-note-hidden');
        summary.textContent = 'Choose task ▼';
      }

      list.style.display = 'none';
      pick.classList.remove('dropdown-open');
      cell.classList.remove('dropdown-open');
      saveLocal();
    };

    caprow.append(apply);
    list.append(caprow);

    ta.oninput = () => {
      ta.classList.remove('task-note-hidden');
      const isOff = ta.value.trim().toUpperCase() === 'OFF';
      ta.style.color = isOff ? 'red' : '';
      ta.style.fontWeight = isOff ? '700' : '';
      ta.style.textAlign = isOff ? 'center' : (document.getElementById('textAlign').value || 'left');
      saveLocal();
    };

    headrow.append(shift);
    cell.append(headrow, pick, ta);
    cal.append(cell);
  }

  const totalCells = offset + daysInMonth;
  const trailingCount = (7 - (totalCells % 7)) % 7;
  for(let i = 0; i < trailingCount; i++){
    const filler = document.createElement('div');
    filler.className = 'day filler';
    cal.append(filler);
  }

  let sig = document.getElementById('signatures');
  if(!sig){
    sig = document.createElement('div');
    sig.id = 'signatures';
    sig.className = 'signatures';
    cal.closest('.sheet-card').appendChild(sig);
  }
  sig.innerHTML =
    '<div class="signature"><div contenteditable="true" oninput="saveSignatures()">Prepared by:</div><div class="name" contenteditable="true" oninput="saveSignatures()"></div><div class="role" contenteditable="true" oninput="saveSignatures()">ADA VI</div></div>' +
    '<div class="signature"><div contenteditable="true" oninput="saveSignatures()">Noted by:</div><div class="name" contenteditable="true" oninput="saveSignatures()"></div><div class="role" contenteditable="true" oninput="saveSignatures()">Center Head</div></div>';

  const savedSig = JSON.parse(localStorage.getItem('workplan-signatures') || '[["Prepared by:","CHRISTOPHER C. ESTACIO","ADA VI"],["Noted by:","DIVINA P. SILOS","Center Head"]]');
  if(Array.isArray(savedSig[0])){
    sig.querySelectorAll('.signature').forEach((f, i) =>
      f.querySelectorAll('[contenteditable]').forEach((el, j) => {
        el.textContent = savedSig[i]?.[j] || ((i === 1 && j === 1) ? 'DIVINA P. SILOS' : el.textContent);
      })
    );
  }

  const savedAlign = localStorage.getItem('workplan-text-align') || 'left';
  document.getElementById('textAlign').value = savedAlign;
  document.documentElement.style.setProperty('--workplan-align', savedAlign);
  document.querySelectorAll('.day textarea').forEach(t => {
    if(t.value.trim().toUpperCase() !== 'OFF') t.style.textAlign = savedAlign;
  });

  updateDashboardStats();
}

function saveSignatures(){
  const sig = document.querySelectorAll('#signatures .signature');
  localStorage.setItem('workplan-signatures', JSON.stringify(Array.from(sig, s => Array.from(s.children, c => c.textContent))));
}

function saveLocal(){
  const saved = {};
  document.querySelectorAll('.day[data-day]').forEach(c => {
    const ta = c.querySelector('textarea');
    saved[c.dataset.day] = {
      number: c.querySelector('.daynum').textContent,
      text: ta.value,
      selectedTasks: Array.from(c.querySelectorAll('.tasklist input:checked'), x => x.value),
      shift: c.querySelector('.shift-select')?.value || ''
    };
  });
  localStorage.setItem(key(), JSON.stringify(saved));
  updateDashboardStats();
}

function clearMonth(){
  if(confirm('Clear all schedule text for this month?')){
    localStorage.removeItem(key());
    render();
  }
}

function applyAlign(){
  const a = document.getElementById('textAlign').value;
  document.documentElement.style.setProperty('--workplan-align', a);
  document.querySelectorAll('.day textarea').forEach(t => {
    if(t.value.trim().toUpperCase() !== 'OFF') t.style.textAlign = a;
  });
  localStorage.setItem('workplan-text-align', a);
}

/* Shared Sheet Builder: Identical layout for Preview AND Letter/A4 Printout */
function buildSheetMarkup(){
  const titleHTML = document.getElementById('title').innerHTML;
  const align = document.getElementById('textAlign').value || 'left';
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const cells = Array.from(document.querySelectorAll('#calendar .day'));
  const totalWeeks = Math.max(1, Math.ceil(cells.length / 7));

  const rowHasData = [];
  for(let r = 0; r < totalWeeks; r++){
    const weekCells = cells.slice(r * 7, r * 7 + 7);
    const hasContent = weekCells.some(cell => {
      if(cell.classList.contains('filler')) return false;
      const shiftVal = (cell.querySelector('.shift-select')?.value || '').trim();
      const ta = cell.querySelector('textarea');
      const rawText = (ta && !ta.classList.contains('task-note-hidden')) ? ta.value.trim() : '';
      return shiftVal !== '' || rawText !== '';
    });
    rowHasData.push(hasContent);
  }

  let activeRowCount = rowHasData.filter(Boolean).length;
  if(activeRowCount === 0){
    activeRowCount = Math.min(5, totalWeeks);
    for(let r = 0; r < activeRowCount; r++) rowHasData[r] = true;
  }

  let gridHTML = days.map(d => '<div class="pv-dow">'+d+'</div>').join('');

  cells.forEach((cell, idx) => {
    const r = Math.floor(idx / 7);
    const hideRow = !rowHasData[r];

    if(cell.classList.contains('filler')){
      gridHTML += '<div class="pv-cell'+(hideRow ? ' pv-empty-row-cell' : '')+'"></div>';
      return;
    }
    const num = cell.querySelector('.daynum')?.textContent || '';
    const rawShiftVal = cell.querySelector('.shift-select')?.value || '';
    const isDayoffShift = rawShiftVal.toUpperCase() === 'DAYOFF';
    const shiftVal = isDayoffShift ? '' : rawShiftVal;
    const ta = cell.querySelector('textarea');
    let rawText = (ta && !ta.classList.contains('task-note-hidden')) ? ta.value.replace(/

+/g, '
').trim() : '';
    if(isDayoffShift && !rawText) rawText = 'OFF';
    const isOff = isDayoffShift || rawText.toUpperCase() === 'OFF';
    const fontPx = computeTaskFontPx(rawText);

    const safeNum = num.replace(/</g,'&lt;');
    const safeShift = shiftVal.replace(/</g,'&lt;');
    const safeBody = rawText.replace(/&/g,'&amp;').replace(/</g,'&lt;');

    gridHTML += '<div class="pv-cell'+(hideRow ? ' pv-empty-row-cell' : '')+'">' +
      '<div class="pv-head">' +
        '<span class="pv-num">'+safeNum+'</span>' +
        (safeShift ? '<span class="pv-shift">'+safeShift+'</span>' : '') +
      '</div>' +
      (safeBody ? '<div class="pv-body'+(isOff?' is-off':'')+'" style="font-size:'+fontPx+'px;text-align:'+(isOff?'center':align)+'">'+safeBody+'</div>' : '') +
    '</div>';
  });

  const sigEls = document.querySelectorAll('#signatures .signature');
  let sigHTML = '';
  sigEls.forEach(s => {
    const parts = s.querySelectorAll('[contenteditable]');
    const lbl = (parts[0]?.textContent || '').replace(/</g,'&lt;');
    const nm = (parts[1]?.textContent || '').replace(/</g,'&lt;');
    const rl = (parts[2]?.textContent || '').replace(/</g,'&lt;');
    sigHTML += '<div class="pv-sig"><div>'+lbl+'</div><div class="pv-sig-name">'+nm+'</div><div>'+rl+'</div></div>';
  });

  return '<div class="pv-title">'+titleHTML+'</div>' +
    '<div class="pv-grid" style="grid-template-rows:7mm repeat('+activeRowCount+',minmax(0,1fr))">'+gridHTML+'</div>' +
    '<div class="pv-sigs">'+sigHTML+'</div>';
}

/* Responsive A4 Landscape Print Preview Logic (Phone & Desktop) */
let currentPreviewZoom = 'fit';
let currentPreviewViewport = 'desktop';

function buildA4PreviewSheet(){
  const mount = document.getElementById('a4SheetMount');
  mount.innerHTML = buildSheetMarkup();
}

function updatePreviewScale(){
  const modal = document.getElementById('a4PreviewModal');
  if(!modal.classList.contains('open')) return;
  const stage = document.getElementById('previewStage');
  const frame = document.getElementById('previewDeviceFrame');
  const scaler = document.getElementById('previewScaler');
  const sheet = document.getElementById('a4SheetMount');

  const isPhoneSim = currentPreviewViewport === 'phone' && window.innerWidth > 800;
  stage.classList.toggle('is-phone-sim', isPhoneSim);
  frame.classList.toggle('phone-mode', isPhoneSim);

  const sheetW = sheet.offsetWidth || 1122.5;
  const sheetH = sheet.offsetHeight || 793.7;
  let scale = 1;

  if(currentPreviewZoom === 'fit'){
    const container = isPhoneSim ? frame : stage;
    const padX = isPhoneSim ? 24 : 36;
    const padY = isPhoneSim ? 44 : 36;
    const availW = Math.max(220, container.clientWidth - padX);
    const availH = Math.max(180, container.clientHeight - padY);
    scale = Math.min(availW / sheetW, availH / sheetH, 1.15);
  } else {
    scale = Number(currentPreviewZoom) || 1;
  }

  sheet.style.transform = 'scale('+scale+')';
  scaler.style.width = Math.round(sheetW * scale) + 'px';
  scaler.style.height = Math.round(sheetH * scale) + 'px';
}

function setPreviewViewport(vp){
  currentPreviewViewport = vp;
  document.querySelectorAll('#previewViewportControls button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.vp === vp);
  });
  updatePreviewScale();
}

function setPreviewZoom(z){
  currentPreviewZoom = z;
  document.querySelectorAll('#previewZoomControls button').forEach(btn => {
    btn.classList.toggle('active', String(btn.dataset.zoom) === String(z));
  });
  updatePreviewScale();
}

function openA4Preview(){
  buildA4PreviewSheet();
  const modal = document.getElementById('a4PreviewModal');
  modal.classList.add('open');
  setPreviewViewport('desktop');
  setPreviewZoom('fit');
}

function closeA4Preview(){
  document.getElementById('a4PreviewModal').classList.remove('open');
}

function triggerExactPrint(){
  const wrapper = document.getElementById('printSheetWrapper');
  wrapper.innerHTML = '<div class="a4-sheet">' + buildSheetMarkup() + '</div>';
  window.print();
}

function printFromPreview(){
  closeA4Preview();
  setTimeout(() => triggerExactPrint(), 60);
}

window.addEventListener('resize', updatePreviewScale);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeA4Preview();
});

// Close task dropdowns when clicking outside
document.addEventListener('click', function(event){
  if(event.target.closest('.taskpick')) return;
  document.querySelectorAll('.taskpick.dropdown-open').forEach(function(p){
    p.classList.remove('dropdown-open');
    p.closest('.day')?.classList.remove('dropdown-open');
    const list = p.querySelector('.tasklist');
    if(list) list.style.display = 'none';
  });
});

// 7-task maximum limit enforcement
(function(){
  const toast = document.getElementById('taskLimitToast');
  let timer;
  function notify(){
    if(!toast) return;
    toast.textContent = 'Maximum of 7 tasks only.';
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  document.addEventListener('change', function(e){
    const cb = e.target;
    if(!cb.matches('.tasklist input[type="checkbox"]') || !cb.checked) return;
    const list = cb.closest('.tasklist');
    if(list && list.querySelectorAll('input[type="checkbox"]:checked').length > 7){
      cb.checked = false;
      notify();
    }
  });
})();

// Keep print wrapper synced even if Ctrl+P / browser print is triggered directly
window.addEventListener('beforeprint', function(){
  const wrapper = document.getElementById('printSheetWrapper');
  if(wrapper && !wrapper.innerHTML.trim()){
    wrapper.innerHTML = '<div class="a4-sheet">' + buildSheetMarkup() + '</div>';
  }
});
window.addEventListener('afterprint', function(){
  const wrapper = document.getElementById('printSheetWrapper');
  if(wrapper) wrapper.innerHTML = '';
});

// Initialize on current real month & year
(function init(){
  for(let i = localStorage.length - 1; i >= 0; i--){
    const k = localStorage.key(i);
    if(k && k.startsWith('workplan-')) localStorage.removeItem(k);
  }
  localStorage.removeItem('workplan-signatures');

  const now = new Date();
  const ySel = document.getElementById('year');
  const mSel = document.getElementById('month');
  if([...ySel.options].some(o => Number(o.value) === now.getFullYear())){
    ySel.value = String(now.getFullYear());
  }
  mSel.value = String(now.getMonth());
  render();
})();
</script>
